# Arise - RTM - game profile (GTA V PS4, vanilla)
# Every key except address_base and allowed_title_ids is a native handler: void f(NativeArg_s*).
# Values are RELATIVE addresses, added to address_base at runtime.
# address_base is the load address of the game image (0x400000 with ASLR off).
# stat_set_int, stat_get_int and stat_save must pass the preflight; the others are optional
# and are simply disabled on this build if their entry check fails.

[1.57]
address_base = 0x400000
allowed_title_ids = CUSA00411, CUSA00419

stat_set_int    = 0xACF4B0
stat_get_int    = 0xACF710
stat_save       = 0xACF0E0

stat_set_bool   = 0xACF520
stat_get_bool   = 0xACF820
stat_set_float  = 0xACF4E0
stat_get_float  = 0xACF7F0

packed_set_bool = 0xAD00F0
packed_get_bool = 0xACFF90
packed_set_int  = 0xAD0140
